services:
  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      XRGPU_COLLECTOR_TOKEN: "${XRGPU_COLLECTOR_TOKEN:?Set XRGPU_COLLECTOR_TOKEN to a random secret of at least 16 characters}"
    volumes:
      - benchmark-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  benchmark-data:
