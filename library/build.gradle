plugins { id 'com.android.library' }

android {
    namespace 'org.xrgpu'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '28.2.13676358'
    defaultConfig {
        minSdk 29
        consumerProguardFiles 'consumer-rules.pro'
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets.main.jniLibs.srcDirs = [rootProject.file(providers.gradleProperty('xrgpuNativeRoot').getOrElse('artifacts/library/lib'))]
    sourceSets.main.assets.srcDirs = [layout.buildDirectory.dir('generated/xrgpuNotices')]
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { jniLibs { useLegacyPackaging = false } }
}

tasks.register('verifyNativeLibrary') {
    doLast {
        def nativeRoot = rootProject.file(providers.gradleProperty('xrgpuNativeRoot').getOrElse('artifacts/library/lib'))
        def nativeLibrary = new File(nativeRoot, 'arm64-v8a/libxrgpu_runtime.so')
        if (!nativeLibrary.isFile()) throw new GradleException('Run python -m runtime.build --library first.')
    }
}
tasks.register('generateLibraryNotices', Sync) {
    def nativeRoot = rootProject.file(providers.gradleProperty('xrgpuNativeRoot').getOrElse('artifacts/library/lib'))
    from(new File(nativeRoot.parentFile, 'share/xrgpu'))
    into layout.buildDirectory.dir('generated/xrgpuNotices/xrgpu')
}
tasks.named('preBuild').configure { dependsOn 'verifyNativeLibrary', 'generateLibraryNotices' }
