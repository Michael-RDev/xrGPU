[project]
name = "xrgpu"
version = "0.1.0"
description = "Reproducible on-headset model-layer optimization for Quest"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=2.0,<3", "pyyaml>=6,<7"]

[project.optional-dependencies]
export = ["executorch==1.4.1", "transformers==4.57.3", "safetensors>=0.5,<1"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.12,<1", "cmake>=3.31,<4", "ninja>=1.12,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
exclude = ["artifacts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
