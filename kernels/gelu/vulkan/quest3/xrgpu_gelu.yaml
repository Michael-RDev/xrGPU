xrgpu_gelu:
  parameter_names_with_default_values:
    DTYPE: float
    STORAGE: texture3d
    OPERATOR: xrgpu_erf_gelu(X)
  generate_variant_forall:
    DTYPE:
    - VALUE: float
    STORAGE:
    - VALUE: texture3d
    - VALUE: buffer
  shader_variants:
  - NAME: xrgpu_gelu_erf
  - NAME: xrgpu_gelu_tanh
    OPERATOR: 0.5 * X * (1.0 + tanh(0.7978845608028654 * (X + 0.044715 * X * X * X)))
