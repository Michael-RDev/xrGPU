# Derived from ExecuTorch linear_vec.yaml (BSD-3-Clause; see THIRD_PARTY_NOTICES).
xrgpu_linear:
  parameter_names_with_default_values:
    DTYPE: float
    STORAGE: texture3d
    WEIGHT_STORAGE: texture2d
    HAS_BIAS: false
    TILE_M4: 1
    TILE_K4: 1
    TILE_N4: 2
    TILE_M: 4
  generate_variant_forall:
    combination:
      parameter_names: [STORAGE, WEIGHT_STORAGE]
      combos:
        - parameter_values: [texture3d, texture2d]
        - parameter_values: [texture3d, buffer]
        - parameter_values: [buffer, texture2d]
        - parameter_values: [buffer, buffer]
    DTYPE:
      - VALUE: float
  shader_variants:
    - NAME: xrgpu_linear_m4
    - NAME: xrgpu_linear_m2
      TILE_M: 2
    - NAME: xrgpu_linear_m4_bias
      HAS_BIAS: true
    - NAME: xrgpu_linear_m2_bias
      TILE_M: 2
      HAS_BIAS: true
