xrgpu_linear:
  parameter_names_with_default_values:
    DTYPE: float
    STORAGE: texture3d
    WEIGHT_STORAGE: texture2d
    HAS_BIAS: false
    TILE_M4: 1
    TILE_K4: 1
    TILE_N4: 1
    TILE_M: 4
  generate_variant_forall:
    combination:
      parameter_names:
      - STORAGE
      - WEIGHT_STORAGE
      combos:
      - parameter_values:
        - texture3d
        - texture2d
      - parameter_values:
        - texture3d
        - buffer
    DTYPE:
    - VALUE: float
  shader_variants:
  - NAME: xrgpu_linear_m1
    TILE_M: 1
    HAS_BIAS: false
  - NAME: xrgpu_linear_m1_bias
    TILE_M: 1
    HAS_BIAS: true
  - NAME: xrgpu_linear_m2
    TILE_M: 2
    HAS_BIAS: false
  - NAME: xrgpu_linear_m2_bias
    TILE_M: 2
    HAS_BIAS: true
  - NAME: xrgpu_linear_m4
    TILE_M: 4
    HAS_BIAS: false
  - NAME: xrgpu_linear_m4_bias
    TILE_M: 4
    HAS_BIAS: true
